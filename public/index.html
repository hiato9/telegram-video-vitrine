<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Escolha uma modelo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <div id="preview"></div>
      <header class="header">
        <p class="eyebrow">Videochamada</p>
        <h1>Escolha uma modelo</h1>
        <p class="sub">Toque numa modelo para ver prévias e escolher o plano.</p>
      </header>
      <main id="grid" class="grid"></main>
    </div>

    <div id="modal" class="modal" hidden>
      <div class="modal-backdrop" data-close="1"></div>
      <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button type="button" class="modal-close" data-close="1" aria-label="Fechar">×</button>
        <div id="modal-head"></div>
        <p class="modal-label">Prévias</p>
        <div id="modal-previews" class="carousel"></div>
        <p class="modal-label">Escolha o plano</p>
        <div id="modal-plans" class="plans"></div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
    <script src="./config.js"></script>
    <script src="./models.js"></script>
    <script src="./plans.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
